name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and Test
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Report the toolchain
        run: |
          xcodebuild -version
          swift format --version

      - name: Boot the simulator
        run: |
          udid=$(xcrun simctl list devices available --json | jq -r '
            [.devices | to_entries[]
              | select(.key | contains("SimRuntime.iOS-"))
              | {version: (.key | split("iOS-")[1] | split("-") | map(tonumber)), device: (.value[] | select(.name == "iPhone Air"))}]
            | sort_by(.version) | last | .device.udid')
          echo "Booting iPhone Air ($udid)"
          xcrun simctl boot "$udid"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"

      - name: Hash the package versions
        id: packages
        run: echo "hash=$(shasum -a 256 Lexicon.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Restore the Swift packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: swiftpm-${{ steps.packages.outputs.hash }}
          restore-keys: swiftpm-

      - name: Lint the sources
        run: swift format lint --recursive --strict Lexicon LexiconTests

      - name: Run the tests
        run: |
          xcodebuild test \
            -scheme Lexicon \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -parallel-testing-enabled NO \
            -skipMacroValidation \
            -resultBundlePath TestResults.xcresult

      - name: Upload the test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults
          path: TestResults.xcresult
